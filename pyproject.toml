[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openscrapper"
dynamic = ["version"]
description = "Lead generation CLI with self-healing scrapers: find, scrape, verify and rank leads from social platforms and any website."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.28.0",
    "httpx>=0.27.0",
    "dnspython>=2.4.0",
    "free-proxy>=1.1.1",
    "rich>=13.7.0",
    "scrapling>=0.5",
]

[project.optional-dependencies]
# real browser tiers for sites that block plain HTTP (Cloudflare etc.)
browser = ["scrapling[fetchers]>=0.5"]
# LLM extraction fallback (also needs OPENSCRAPPER_LLM set)
ai = ["scrapegraphai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
openscrapper = "openscrapper:cli"

[project.urls]
Source = "https://github.com/ayushks1ngh/OpenScapper"

[tool.setuptools]
py-modules = ["openscrapper"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
